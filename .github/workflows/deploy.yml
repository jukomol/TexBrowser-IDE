# Builds TexBrowser IDE and publishes it to GitHub Pages.
#
# Every push and pull request gets the full build and test run (unit tests,
# engine and UI end-to-end tests in headless Chromium). Only the default branch,
# or a manual run, deploys.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Build & deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      # WebAssembly TeX engine (BusyTeX, TeX Live 2022): ~180 MB of assets pinned
      # to an exact upstream commit and verified by SHA-256.
      - name: Cache engine assets
        uses: actions/cache@v4
        with:
          path: public/engine
          key: engine-${{ hashFiles('scripts/fetch-engine.mjs') }}
      - name: Fetch engine
        run: npm run engine:fetch

      # Package shelf: every LaTeX package of the TeX Live collections below,
      # split into small per-package bundles that the browser fetches on demand.
      - name: Install TeX Live (shelf source)
        timeout-minutes: 20
        run: |
          # The runner's Azure Ubuntu mirror sometimes trickles or stalls. apt's own
          # timeouts only catch silent connections, so each attempt is capped; on a
          # failed attempt the main Ubuntu archive is put first and apt retries,
          # reusing the packages it already downloaded.
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          PKGS="texlive-base texlive-latex-base texlive-latex-recommended texlive-latex-extra
            texlive-fonts-recommended texlive-pictures texlive-science texlive-bibtex-extra
            texlive-lang-greek texlive-plain-generic tex-gyre cm-super"
          sudo apt-get $APT_OPTS update -qq
          for attempt in 1 2 3; do
            if sudo timeout 300 apt-get $APT_OPTS install -y -qq --no-install-recommends $PKGS; then break; fi
            [ "$attempt" = 3 ] && { echo "::error::apt install failed 3 times"; exit 1; }
            echo "::warning::apt install attempt $attempt failed or stalled; switching mirrors and retrying"
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://us.archive.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' \
                | sudo tee /etc/apt/apt-mirrors.txt
            fi
            sudo dpkg --configure -a || true
            sudo apt-get $APT_OPTS update -qq
          done
          echo "FONTS_EXTRA_VERSION=$(apt-cache show --no-all-versions texlive-fonts-extra | sed -n 's/^Version: //p')" >> "$GITHUB_ENV"

      # texlive-fonts-extra is 1.7 GB (a 629 MB download): it is cached between runs,
      # unpacked aside, and only the packages listed in scripts/shelf-extra-packages.txt
      # (newtx, Libertine, Source Pro, …) are shelved.
      - name: Cache texlive-fonts-extra
        id: fonts-extra
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/texlive-fonts-extra.deb
          key: texlive-fonts-extra-${{ env.FONTS_EXTRA_VERSION }}
      - name: Download texlive-fonts-extra
        if: steps.fonts-extra.outputs.cache-hit != 'true'
        timeout-minutes: 20
        run: scripts/ci/download-deb.sh texlive-fonts-extra "$RUNNER_TEMP/texlive-fonts-extra.deb"
      - name: Unpack texlive-fonts-extra
        run: dpkg-deb -x "$RUNNER_TEMP/texlive-fonts-extra.deb" "$RUNNER_TEMP/fonts-extra"
      - name: Build package shelf
        timeout-minutes: 10
        run: |
          npm run shelf:build -- \
            --texmf /usr/share/texlive/texmf-dist --texmf /usr/share/texmf \
            --map /var/lib/texmf/fonts/map/pdftex/updmap/pdftex.map \
            --extra-texmf "$RUNNER_TEMP/fonts-extra/usr/share/texlive/texmf-dist" \
            --extra-packages scripts/shelf-extra-packages.txt \
            --label "TeX Live 2023 (Ubuntu 24.04)" --budget-mb 750

      - name: Build site
        run: npm run build

      - name: End-to-end tests (real engine, headless Chromium)
        timeout-minutes: 20
        run: |
          npx playwright install --with-deps chromium
          npm run e2e -- --prod

      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/out/*.png
          if-no-files-found: ignore

      - name: Report size
        run: du -sh dist dist/engine dist/shelf

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
